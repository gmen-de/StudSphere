<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Flat-fill variant of /logo.svg for the PDF report footer (src/pdf_report.php) -->
  <!-- mPDF's SVG renderer silently drops radialGradient fills (tested: the -->
  <!-- main sphere circle disappeared entirely, only the thin orbit/satellite -->
  <!-- outlines survived) — this copy replaces the gradient with its flat -->
  <!-- mid-tone color instead, otherwise pixel-identical to the site logo. -->
  <ellipse cx="32" cy="33" rx="28" ry="8.5" fill="none" stroke="#0ea5e9" stroke-opacity="0.5" stroke-width="2" transform="rotate(-16 32 33)"/>
  <circle cx="32" cy="31" r="19" fill="#2563eb"/>
  <path d="M32 12a19 19 0 0 1 0 38 19 19 0 0 0 0-38z" fill="#0b3fa8" fill-opacity="0.22"/>
  <circle cx="25.4" cy="23.4" r="4" fill="#ffffff" fill-opacity="0.35"/>
  <path d="M4,33 A28,8.5 0 0 0 60,33" fill="none" stroke="#0ea5e9" stroke-width="2.6" stroke-linecap="round" transform="rotate(-16 32 33)"/>
  <rect x="50.89" y="26.86" width="9" height="9" rx="2.52" fill="#f7fbff" stroke="#0b3fa8" stroke-opacity="0.22" stroke-width="1"/>
  <circle cx="55.39" cy="26.46" r="1.5" fill="#0ea5e9"/>
  <rect x="5.83" y="40.15" width="7" height="7" rx="1.96" fill="#f7fbff" stroke="#0b3fa8" stroke-opacity="0.22" stroke-width="1"/>
  <circle cx="9.33" cy="39.75" r="1.5" fill="#0ea5e9"/>
</svg>
